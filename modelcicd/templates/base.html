<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Model CICD{% endblock %}</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0;
           background: #0f1115; color: #e6e6e6; }
    header { padding: 16px 24px; border-bottom: 1px solid #2a2d34; }
    header a { color: #e6e6e6; text-decoration: none; font-weight: 600; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0 28px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #23262c;
             font-size: 14px; }
    th { color: #9aa0aa; font-weight: 600; text-transform: uppercase; font-size: 11px;
         letter-spacing: .04em; }
    tr.approved { background: #10331c; }
    tr.shortlisted td:first-child { color: #ffcf5c; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .badge.pending { background: #3a2f10; color: #ffcf5c; }
    .badge.approved { background: #123a20; color: #7ee2a0; }
    .badge.tie { background: #23262c; color: #cfd3da; }
    .badge.none { background: #23262c; color: #9aa0aa; }

    /* Chart tokens — validated against this page's card surface (#171a21):
       node scripts/validate_palette.js "#3987e5" --mode dark --surface "#171a21"
       node scripts/validate_palette.js "#0ca30c" --mode dark --surface "#171a21"
       both PASS all checks. */
    .chart { --bar-normal: #3987e5; --bar-approved: #0ca30c; --track: #23262c;
             --tick: #383835; margin: 8px 0 4px; }
    .bar-row { display: grid; grid-template-columns: 220px 1fr 48px; align-items: center;
               gap: 12px; padding: 5px 0; position: relative; }
    .bar-label { font-size: 13px; color: #cfd3da; white-space: nowrap; overflow: hidden;
                 text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .bar-track { position: relative; height: 20px; background: var(--track);
                 border-radius: 0 4px 4px 0; }
    .bar-fill { height: 20px; border-radius: 0 4px 4px 0; background: var(--bar-normal);
                transition: filter .1s; }
    .bar-fill.is-approved { background: var(--bar-approved); }
    .bar-row:hover .bar-fill, .bar-row:focus-within .bar-fill { filter: brightness(1.18); }
    .bar-value { font-size: 12px; color: #9aa0aa; text-align: right; }
    .chart-axis { display: grid; grid-template-columns: 220px 1fr 48px; gap: 12px;
                  margin-top: 2px; }
    .chart-axis .ticks { display: flex; justify-content: space-between;
                          border-top: 1px solid var(--tick); padding-top: 4px; }
    .chart-axis .ticks span { font-size: 11px; color: #898781; }
    .bar-tooltip { position: absolute; top: -6px; left: 220px; transform: translateY(-100%);
                   background: #1c1f26; border: 1px solid #2a2d34; border-radius: 6px;
                   padding: 6px 10px; font-size: 12px; color: #e6e6e6; white-space: nowrap;
                   opacity: 0; visibility: hidden; pointer-events: none; z-index: 1; }
    .bar-row:hover .bar-tooltip, .bar-row:focus-within .bar-tooltip {
      opacity: 1; visibility: visible; }
    .bar-tooltip strong { color: #ffffff; }
    .sparkline { vertical-align: middle; display: block; }
    .card { background: #171a21; border: 1px solid #23262c; border-radius: 10px;
            padding: 16px 20px; margin-bottom: 16px; }
    .card.flash-success { border-color: #1e5c33; background: #10331c; color: #d3f5df; }
    .card.flash-error { border-color: #5c2626; background: #331414; color: #f5d3d3; }
    .btn-approve { margin-top: 10px; padding: 8px 16px; border: none; border-radius: 6px;
                   background: #0ca30c; color: #ffffff; font-size: 13px; font-weight: 600;
                   cursor: pointer; }
    .btn-approve:hover { filter: brightness(1.1); }
    a.link { color: #7db2ff; text-decoration: none; }
    a.link:hover { text-decoration: underline; }
    .muted { color: #9aa0aa; font-size: 13px; }
    code { background: #1c1f26; padding: 1px 6px; border-radius: 4px; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    h2 { font-size: 15px; color: #cfd3da; margin-top: 28px; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">Model CICD</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
