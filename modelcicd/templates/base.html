<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Applied before first paint, so a returning visitor's saved choice never
    // flashes the wrong theme. No saved choice = follow the OS preference
    // (handled purely in CSS below) — this only runs for an explicit choice.
    (function () {
      try {
        var saved = localStorage.getItem("modelcicd-theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) { /* localStorage unavailable — falls back to OS preference */ }
    })();
  </script>
  <title>{% block title %}Model CICD{% endblock %}</title>
  <style>
    /* ══ Design system ═════════════════════════════════════════════════════
       This is a developer infrastructure tool — a leaderboard of evidence
       behind a production decision — so it's styled like one: dense but
       breathing, monospace for every identifier (model ids, prices, paths,
       scores), and colour reserved strictly for meaning (approved / pending
       / failed). No webfont: this app is self-hosted and must render
       identically with no network, so hierarchy comes from the type SCALE,
       not from a downloaded typeface.

       Dark is the default (unguarded :root); an explicit data-theme choice
       always beats the OS preference, in both directions. Every rule below
       reads a token, never a literal colour, so both themes live in one
       place. */

    :root {
      color-scheme: dark;

      /* Surfaces, deliberately layered: page → panel → raised. The old
         palette had all three within a few points of each other, which is
         why everything read as one flat sheet of boxes. */
      --bg: #0d0f13;
      --panel: #14171d;
      --raised: #1b1f27;
      --input-bg: #0f1216;

      --border: #272b34;
      --border-soft: #1e222a;

      --fg: #e8eaee;
      --muted-2: #c3c8d2;
      --muted: #8c94a1;

      --link: #7fa9ff;
      --accent: #3b6df0;
      --accent-fg: #ffffff;
      --accent-bright: #5b8cff;

      --green: #1a9e4b;
      --success-bg: #0f2a1a;
      --success-border: #1e5c33;
      --success-fg: #86e2a6;
      --approved-bg: #10301e;
      --approved-fg: #7ee2a0;

      --error-bg: #2b1416;
      --error-border: #6b2b30;
      --error-fg: #f0a6a6;

      --pending-bg: #2e2410;
      --pending-fg: #f2c65c;

      --neutral-badge-bg: #22262e;
      --neutral-badge-fg: #c3c8d2;
      --none-badge-fg: #8c94a1;

      --tick: #2b303a;
      --tick-text: #7d8494;

      --shadow: 0 1px 2px rgba(0,0,0,.32), 0 4px 12px rgba(0,0,0,.22);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.28);

      /* Type scale + spacing scale — one source for both, so rhythm is
         consistent instead of re-guessed as an inline style per template. */
      --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text",
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "Cascadia Mono", "Cascadia Code", "SF Mono",
                   "Segoe UI Mono", Consolas, "Liberation Mono", monospace;
      --fs-xs: 11px;  --fs-sm: 12px;  --fs-base: 13.5px;
      --fs-md: 15px;  --fs-lg: 19px;  --fs-xl: 25px;
      --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;  --sp-4: 16px;
      --sp-5: 24px; --sp-6: 32px; --sp-7: 40px;
      --radius: 8px; --radius-sm: 5px; --radius-lg: 12px;
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --raised: #f2f4f7;
        --input-bg: #ffffff;
        --border: #dce0e7;
        --border-soft: #e8ebf0;
        --fg: #14171c;
        --muted-2: #3d434e;
        --muted: #666e7c;
        --link: #1d4ed8;
        --accent: #2b52d4;
        --accent-fg: #ffffff;
        --accent-bright: #3568e0;
        --green: #12833f;
        --success-bg: #eaf8ef;
        --success-border: #9bd9b1;
        --success-fg: #10602f;
        --approved-bg: #e6f7ec;
        --approved-fg: #12602f;
        --error-bg: #fdecec;
        --error-border: #e5a3a3;
        --error-fg: #8f2020;
        --pending-bg: #fdf3d6;
        --pending-fg: #74560a;
        --neutral-badge-bg: #eef0f4;
        --neutral-badge-fg: #454b57;
        --none-badge-fg: #6b7280;
        --tick: #dce0e7;
        --tick-text: #7b8290;
        --shadow: 0 1px 2px rgba(20,23,28,.06), 0 4px 12px rgba(20,23,28,.05);
        --shadow-sm: 0 1px 2px rgba(20,23,28,.06);
      }
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --raised: #f2f4f7;
      --input-bg: #ffffff;
      --border: #dce0e7;
      --border-soft: #e8ebf0;
      --fg: #14171c;
      --muted-2: #3d434e;
      --muted: #666e7c;
      --link: #1d4ed8;
      --accent: #2b52d4;
      --accent-fg: #ffffff;
      --accent-bright: #3568e0;
      --green: #12833f;
      --success-bg: #eaf8ef;
      --success-border: #9bd9b1;
      --success-fg: #10602f;
      --approved-bg: #e6f7ec;
      --approved-fg: #12602f;
      --error-bg: #fdecec;
      --error-border: #e5a3a3;
      --error-fg: #8f2020;
      --pending-bg: #fdf3d6;
      --pending-fg: #74560a;
      --neutral-badge-bg: #eef0f4;
      --neutral-badge-fg: #454b57;
      --none-badge-fg: #6b7280;
      --tick: #dce0e7;
      --tick-text: #7b8290;
      --shadow: 0 1px 2px rgba(20,23,28,.06), 0 4px 12px rgba(20,23,28,.05);
      --shadow-sm: 0 1px 2px rgba(20,23,28,.06);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d0f13;
      --panel: #14171d;
      --raised: #1b1f27;
      --input-bg: #0f1216;
      --border: #272b34;
      --border-soft: #1e222a;
      --fg: #e8eaee;
      --muted-2: #c3c8d2;
      --muted: #8c94a1;
      --link: #7fa9ff;
      --accent: #3b6df0;
      --accent-fg: #ffffff;
      --accent-bright: #5b8cff;
      --green: #1a9e4b;
      --success-bg: #0f2a1a;
      --success-border: #1e5c33;
      --success-fg: #86e2a6;
      --approved-bg: #10301e;
      --approved-fg: #7ee2a0;
      --error-bg: #2b1416;
      --error-border: #6b2b30;
      --error-fg: #f0a6a6;
      --pending-bg: #2e2410;
      --pending-fg: #f2c65c;
      --neutral-badge-bg: #22262e;
      --neutral-badge-fg: #c3c8d2;
      --none-badge-fg: #8c94a1;
      --tick: #2b303a;
      --tick-text: #7d8494;
      --shadow: 0 1px 2px rgba(0,0,0,.32), 0 4px 12px rgba(0,0,0,.22);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.28);
    }

    /* ══ Base ══════════════════════════════════════════════════════════ */

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: var(--font-sans); font-size: var(--fs-base); line-height: 1.55;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      transition: background-color .15s ease, color .15s ease;
    }
    main { padding: var(--sp-6) var(--sp-5) var(--sp-7); max-width: 1180px; margin: 0 auto; }

    h1 { font-size: var(--fs-xl); line-height: 1.2; letter-spacing: -.018em;
         font-weight: 680; margin: 0 0 var(--sp-2); text-wrap: balance; }
    h2 { font-size: var(--fs-md); line-height: 1.3; letter-spacing: -.01em;
         font-weight: 650; color: var(--fg); margin: var(--sp-6) 0 var(--sp-3); }
    h3 { font-size: var(--fs-base); font-weight: 650; margin: 0 0 var(--sp-2); }
    p { margin: 0 0 var(--sp-3); }

    a.link { color: var(--link); text-decoration: none; font-weight: 500; }
    a.link:hover { text-decoration: underline; text-underline-offset: 2px; }

    .muted { color: var(--muted); font-size: var(--fs-sm); }
    .hint { color: var(--muted); font-weight: 400; font-size: var(--fs-sm); }
    .mono, code, .num {
      font-family: var(--font-mono); font-variant-numeric: tabular-nums;
      font-size: .92em;
    }
    code {
      background: var(--raised); border: 1px solid var(--border-soft);
      padding: .1em .4em; border-radius: var(--radius-sm); color: var(--muted-2);
    }
    /* Every number in a data position lines up column to column. */
    td, th, .stat-value, .bar-value, .num { font-variant-numeric: tabular-nums; }

    /* ══ Header ════════════════════════════════════════════════════════ */

    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--sp-4); padding: var(--sp-3) var(--sp-5);
      border-bottom: 1px solid var(--border-soft);
      position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(140%) blur(10px);
    }
    .brand { display: flex; align-items: center; gap: var(--sp-2);
             color: var(--fg); text-decoration: none; }
    .brand-mark { display: block; flex-shrink: 0; }
    .brand-name { font-size: var(--fs-md); font-weight: 680; letter-spacing: -.02em; }
    .nav { display: flex; align-items: center; gap: var(--sp-2); }

    /* ══ Panels ════════════════════════════════════════════════════════
       `.panel` is the primary container; `.card` is kept as an alias so
       every existing template keeps working while looking new. Not
       everything should be a panel — border + fill + shadow all say
       "separate object", and spending them on every block flattens the
       hierarchy instead of creating one. */

    .panel, .card {
      background: var(--panel); border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      padding: var(--sp-4) var(--sp-5); margin-bottom: var(--sp-4);
    }
    .panel-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: var(--sp-3); margin: 0 0 var(--sp-3);
    }
    .panel-head h2, .panel-head h3 { margin: 0; }
    .panel-flush { padding: 0; overflow: hidden; }
    .panel-flush > table { margin: 0; }

    .card.flash-success, .flash-success {
      border-color: var(--success-border); background: var(--success-bg);
      color: var(--success-fg);
    }
    .card.flash-error, .flash-error, .errors {
      border-color: var(--error-border); background: var(--error-bg); color: var(--error-fg);
    }
    .errors ul { margin: var(--sp-2) 0 0; padding-left: 18px; }

    /* Page header block: title, one-line subtitle, actions on the right. */
    .page-head { margin-bottom: var(--sp-5); }
    .page-head .sub { color: var(--muted); font-size: var(--fs-base); margin: 0; max-width: 68ch; }
    .crumb { font-size: var(--fs-sm); margin: 0 0 var(--sp-2); }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); }
    .toolbar .sep { color: var(--border); }
    .stack { display: flex; flex-direction: column; gap: var(--sp-3); }
    .stack-tight { display: flex; flex-direction: column; gap: var(--sp-1); }

    /* ══ Stat tiles ════════════════════════════════════════════════════
       For the handful of numbers that ARE the point of a page (approved
       model, score, pending candidate) — label above, value below, value
       in mono so ids and scores align and read as data. */

    .stat-grid {
      display: grid; gap: var(--sp-4);
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }
    .stat-label {
      font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); margin-bottom: var(--sp-1);
    }
    .stat-value {
      font-family: var(--font-mono); font-size: var(--fs-base);
      color: var(--fg); word-break: break-word;
    }
    .stat-value.is-big { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; }
    .stat-value.is-empty { color: var(--muted); font-family: var(--font-sans); }
    .stat-note { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }

    /* ══ Badges ════════════════════════════════════════════════════════ */

    .badge, .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      font-size: var(--fs-xs); font-weight: 650;
      text-transform: uppercase; letter-spacing: .05em;
      border: 1px solid transparent; white-space: nowrap;
    }
    .badge.pending { background: var(--pending-bg); color: var(--pending-fg);
                     border-color: color-mix(in srgb, var(--pending-fg) 26%, transparent); }
    .badge.approved { background: var(--approved-bg); color: var(--approved-fg);
                      border-color: color-mix(in srgb, var(--approved-fg) 26%, transparent); }
    .badge.tie { background: var(--neutral-badge-bg); color: var(--neutral-badge-fg);
                 border-color: var(--border); }
    .badge.none { background: transparent; color: var(--none-badge-fg); border-color: var(--border); }

    /* ══ Tables ════════════════════════════════════════════════════════ */

    table { width: 100%; border-collapse: collapse; margin: var(--sp-3) 0 var(--sp-6); }
    th, td { text-align: left; padding: var(--sp-2) var(--sp-3);
             border-bottom: 1px solid var(--border-soft); font-size: var(--fs-base);
             vertical-align: top; }
    th {
      color: var(--muted); font-weight: 600; text-transform: uppercase;
      font-size: var(--fs-xs); letter-spacing: .07em; white-space: nowrap;
      border-bottom-color: var(--border);
    }
    tbody tr { transition: background-color .1s ease; }
    tbody tr:hover { background: var(--raised); }
    tr.approved { background: var(--success-bg); }
    tr.approved:hover { background: color-mix(in srgb, var(--success-bg) 80%, var(--fg) 4%); }
    tr.shortlisted td:first-child { box-shadow: inset 2px 0 0 var(--pending-fg); }

    /* ══ Buttons ═══════════════════════════════════════════════════════ */

    .btn, .btn-approve {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius-sm);
      font-family: inherit; font-size: var(--fs-sm); font-weight: 600;
      line-height: 1.2; cursor: pointer; text-decoration: none;
      border: 1px solid var(--border); background: var(--raised); color: var(--fg);
      transition: background-color .12s ease, border-color .12s ease, transform .06s ease;
    }
    .btn:hover { background: color-mix(in srgb, var(--raised) 70%, var(--fg) 8%);
                 border-color: var(--muted); }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--accent); border-color: var(--accent); color: var(--accent-fg);
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: color-mix(in srgb, var(--accent) 86%, #fff 14%);
                         border-color: color-mix(in srgb, var(--accent) 86%, #fff 14%); }
    .btn-approve { background: var(--green); border-color: var(--green); color: #fff; }
    .btn-approve:hover { background: color-mix(in srgb, var(--green) 86%, #fff 14%); }
    .btn-icon { padding: 6px 9px; font-size: var(--fs-md); line-height: 1; }
    .btn-sm { padding: 4px 10px; font-size: var(--fs-xs); }
    .btn[disabled] { cursor: default; opacity: .7; }

    /* ══ Forms ═════════════════════════════════════════════════════════ */

    label { display: block; font-size: var(--fs-sm); font-weight: 550;
            color: var(--muted-2); margin: var(--sp-4) 0 var(--sp-1); }
    label:first-child { margin-top: 0; }
    input[type=text], input[type=email], input[type=number], input[type=url],
    input[type=password], textarea, select {
      width: 100%; background: var(--input-bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 7px 10px; font-size: var(--fs-base); font-family: inherit;
      transition: border-color .12s ease, box-shadow .12s ease;
    }
    input:hover, textarea:hover, select:hover { border-color: var(--muted); }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--accent-bright);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-bright) 22%, transparent);
    }
    textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
    input[type=range] { padding: 0; accent-color: var(--accent); }
    fieldset { border: 1px solid var(--border-soft); border-radius: var(--radius);
               padding: var(--sp-3) var(--sp-4); margin: var(--sp-3) 0;
               background: color-mix(in srgb, var(--raised) 45%, transparent); }
    fieldset legend { padding: 0 6px; color: var(--muted); font-size: var(--fs-xs);
                      font-weight: 650; text-transform: uppercase; letter-spacing: .07em; }
    .row { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: var(--sp-3); }
    .row3 { display: grid; grid-template-columns: 1fr 2fr 90px; gap: var(--sp-3); }
    @media (max-width: 720px) {
      .row, .row3 { grid-template-columns: 1fr; }
    }
    .checkline { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; }
    .checkline input { width: auto; accent-color: var(--accent); }
    .checkline label { margin: 0; }

    /* ══ Chart ═════════════════════════════════════════════════════════ */

    .chart { --bar-normal: var(--accent-bright); --bar-approved: var(--green);
             --track: var(--raised); margin: var(--sp-2) 0 var(--sp-1); }
    .bar-row { display: grid; grid-template-columns: minmax(150px, 260px) 1fr 52px;
               align-items: center; gap: var(--sp-3); padding: 4px 0; position: relative; }
    .bar-label { font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--muted-2);
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                 display: flex; align-items: center; gap: 6px; }
    .bar-track { position: relative; height: 18px; background: var(--track);
                 border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 3px; background: var(--bar-normal);
                transition: filter .1s; }
    .bar-fill.is-approved { background: var(--bar-approved); }
    .bar-row:hover .bar-fill, .bar-row:focus-within .bar-fill { filter: brightness(1.14); }
    .bar-value { font-family: var(--font-mono); font-size: var(--fs-sm);
                 color: var(--fg); text-align: right; }
    .chart-axis { display: grid; grid-template-columns: minmax(150px, 260px) 1fr 52px;
                  gap: var(--sp-3); margin-top: 2px; }
    .chart-axis .ticks { display: flex; justify-content: space-between;
                          border-top: 1px solid var(--tick); padding-top: 4px; }
    .chart-axis .ticks span { font-family: var(--font-mono); font-size: var(--fs-xs);
                              color: var(--tick-text); }
    .bar-tooltip { position: absolute; top: -6px; left: 150px; transform: translateY(-100%);
                   background: var(--raised); border: 1px solid var(--border);
                   border-radius: var(--radius-sm); padding: var(--sp-2) var(--sp-3);
                   font-size: var(--fs-sm); color: var(--fg); white-space: nowrap;
                   opacity: 0; visibility: hidden; pointer-events: none; z-index: 5;
                   box-shadow: var(--shadow); }
    .bar-row:hover .bar-tooltip, .bar-row:focus-within .bar-tooltip {
      opacity: 1; visibility: visible; }
    .sparkline { vertical-align: middle; display: block; }

    /* ══ Stepper ═══════════════════════════════════════════════════════
       "What do I do next" on a project page — a done step is filled and
       checked, the current one outlined, later ones muted, so the right
       next click is never a guess among a row of equal-looking buttons. */

    .stepper { display: flex; align-items: center; margin: 0 0 var(--sp-5);
               overflow-x: auto; padding-bottom: 2px; }
    .step { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
    .step-dot { width: 20px; height: 20px; border-radius: 50%; display: flex;
               align-items: center; justify-content: center;
               font-size: var(--fs-xs); font-weight: 700; flex-shrink: 0;
               background: var(--raised); border: 1.5px solid var(--border); color: var(--muted); }
    .step.is-done .step-dot { background: var(--green); border-color: var(--green); color: #fff; }
    .step.is-current .step-dot { border-color: var(--accent-bright); color: var(--accent-bright);
                                 box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-bright) 18%, transparent); }
    .step-label { font-size: var(--fs-sm); color: var(--muted); white-space: nowrap; }
    .step.is-done .step-label, .step.is-current .step-label { color: var(--fg); font-weight: 600; }
    .step-line { width: 26px; height: 1.5px; background: var(--border);
                 flex-shrink: 0; margin: 0 var(--sp-2); }
    .step-line.is-done { background: var(--green); }

    /* ══ Details / disclosure ══════════════════════════════════════════ */

    details > summary { cursor: pointer; font-size: var(--fs-sm); color: var(--link);
                        font-weight: 550; padding: var(--sp-1) 0; }
    details > summary:hover { text-decoration: underline; text-underline-offset: 2px; }
    details[open] > summary { margin-bottom: var(--sp-2); }

    .empty { color: var(--muted); font-size: var(--fs-base);
             padding: var(--sp-5) 0; text-align: center; }

    /* Working state for any form that calls a model — these take minutes,
       not seconds, and with nothing shown the page looks identical to
       broken. Applied by the script at the bottom of this file. */
    .btn .spinner { display: inline-block; width: 12px; height: 12px;
                   border: 2px solid currentColor; border-right-color: transparent;
                   border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Accessibility: a visible focus ring on everything interactive — the
       browser default is nearly invisible on both of these palettes. */
    a:focus-visible, button:focus-visible, .btn:focus-visible, summary:focus-visible,
    input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--accent-bright); outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="brand" aria-label="Model CICD home">
      <!-- Three ascending bars: the leaderboard this tool exists to produce. -->
      <svg class="brand-mark" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1.5" y="11" width="4.4" height="7.5" rx="1.3" fill="var(--muted)"/>
        <rect x="7.8" y="7" width="4.4" height="11.5" rx="1.3" fill="var(--accent-bright)"/>
        <rect x="14.1" y="2" width="4.4" height="16.5" rx="1.3" fill="var(--green)"/>
      </svg>
      <span class="brand-name">Model CICD</span>
    </a>
    <nav class="nav">
      <button type="button" id="theme_toggle" class="btn btn-icon"
              title="Switch between light and dark" aria-label="Toggle colour theme">🌓</button>
      <a href="{{ url_for('keys_form') }}" class="btn">API keys</a>
      <a href="{{ url_for('connect_project_form') }}" class="btn btn-primary">New project</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("theme_toggle");
      function current() {
        var explicit = root.getAttribute("data-theme");
        if (explicit) return explicit;
        return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      function apply(theme) {
        root.setAttribute("data-theme", theme);
        try { localStorage.setItem("modelcicd-theme", theme); } catch (e) { /* ignore */ }
        btn.textContent = theme === "light" ? "☀️" : "🌙";
      }
      apply(current());
      btn.addEventListener("click", function () {
        apply(current() === "light" ? "dark" : "light");
      });
    })();

    // Any form calling a model can take minutes, not seconds — with nothing
    // shown, a slow request and a stuck page look identical. Opt in with
    // data-working-text="..." on the <form>; shows a spinner and disables
    // the submit button so a double-click can't fire the same spend twice.
    document.querySelectorAll("form[data-working-text]").forEach(function (form) {
      form.addEventListener("submit", function (event) {
        // A form with its own onsubmit="return confirm(...)" may cancel the
        // submit (user clicked Cancel) — that handler runs first (attached
        // during HTML parsing) and sets this, so don't show "working" for a
        // submission that never actually happened.
        if (event.defaultPrevented) return;
        var btn = form.querySelector('button[type="submit"]');
        if (!btn || btn.disabled) return;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>' + form.dataset.workingText;
      });
    });
  </script>
</body>
</html>
