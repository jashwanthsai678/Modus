[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcicd"
version = "0.1.0"
description = "Continuous model discovery, sandboxed benchmarking, and human-approved promotion for every place your application calls an LLM."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.scripts]
modelcicd = "modelcicd.cli:main"

[tool.setuptools.packages.find]
include = ["modelcicd*"]

[tool.setuptools.package-data]
modelcicd = ["templates/*.html"]
