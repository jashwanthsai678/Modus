[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcicd"
version = "0.1.0"
description = "Continuous model discovery, sandboxed benchmarking, and human-approved promotion for every place your application calls an LLM."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "Flask>=3.0",
    # anyio (httpx's async backend) and click (Flask's CLI dependency) both
    # started using Python 3.10+ `match` syntax in their own source past
    # these versions — pinned below that so importing them doesn't hard-fail
    # with a SyntaxError on this project's declared minimum Python (3.9).
    "anyio<4.5",
    "click<8.2",
]

[project.scripts]
modelcicd = "modelcicd.cli:main"

[tool.setuptools.packages.find]
include = ["modelcicd*"]

[tool.setuptools.package-data]
modelcicd = ["templates/*.html"]
